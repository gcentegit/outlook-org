name: Release — imágenes arm64 y despliegue

# En cada push a main se construyen y publican las imágenes (etiqueta = sha corto) para tenerlas
# listas, pero NO se despliega. Solo un tag `vX.Y.Z` despliega: fija en Dokploy la imagen exacta
# (`application.saveDockerProvider`) y llama a `application.deploy`. Nunca se despliega `latest`:
# existe solo como referencia. Volver atrás es lanzar el workflow a mano con la etiqueta anterior.
#
# Secretos del repositorio (el despliegue se omite si no existe DOKPLOY_API_KEY):
#   DOKPLOY_API_URL      URL del panel de Dokploy, p. ej. https://admin.example.com
#   DOKPLOY_API_KEY      clave de la API (cabecera x-api-key)
#   GHCR_PULL_USERNAME   (solo con imágenes privadas) usuario que descarga de GHCR
#   GHCR_PULL_TOKEN      (solo con imágenes privadas) token con permiso read:packages
# Variable opcional del repositorio: WEB_URL (por defecto https://clasificador.arcofood.com).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de imagen (sha corto) a desplegar, p. ej. para volver atrás. No construye nada.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  DOKPLOY_PROJECT: clasificador.arcofood
  DOKPLOY_ENVIRONMENT: production

jobs:
  build-push:
    name: Build & Push — ${{ matrix.app }}
    if: github.event_name != 'workflow_dispatch'
    # Runner arm64 nativo: el servidor de Dokploy es arm64 (Oracle Ampere); sin QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La misma etiqueta corta que genera docker/metadata-action (7 caracteres del commit).
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/clasificador-${{ matrix.app }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché vive en el propio registro. Exportarla es lo caro: solo bajo demanda
          # (variable del repositorio EXPORT_BUILD_CACHE=true); leerla es gratis.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/clasificador-${{ matrix.app }}:buildcache
          cache-to: ${{ vars.EXPORT_BUILD_CACHE == 'true' && format('type=registry,ref={0}/{1}/clasificador-{2}:buildcache,mode=max', env.REGISTRY, env.OWNER, matrix.app) || '' }}
          # /health y /api/health devuelven este valor: es la etiqueta de la imagen (sha corto).
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.short }}

  # Despliega la etiqueta exacta. Solo en tags `v*.*.*` o a mano, y solo si hay clave de Dokploy.
  deploy:
    name: Deploy to Dokploy
    needs: [build-push]
    # `build-push` se salta en el lanzamiento manual; aun así el despliegue debe correr.
    if: >-
      !cancelled() && !failure() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      WEB_URL: ${{ vars.WEB_URL || 'https://clasificador.arcofood.com' }}
      INPUT_TAG: ${{ inputs.tag }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_REF: ${{ github.ref_name }}
    steps:
      # Solo para el script de espera (infra/scripts); no se construye nada aquí.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/scripts

      - name: Comprobar que hay clave de Dokploy
        id: gate
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_API_URL" ]; then
            echo "::notice::Sin DOKPLOY_API_KEY/DOKPLOY_API_URL: las imágenes están publicadas, pero no se despliega nada."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # El worker aplica las migraciones al arrancar: la web solo se despliega cuando el worker ya
      # está sano con la imagen nueva. Si el despliegue del worker falla o el contenedor no queda
      # sano, el flujo se detiene antes de tocar la web.
      - name: Fijar la imagen exacta y desplegar (el worker primero; la web, cuando el worker esté sano)
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          API="${DOKPLOY_API_URL%/}"; API="${API%/api}/api"

          # Etiqueta = sha corto del commit (como docker/metadata-action) o la indicada a mano.
          TAG="${INPUT_TAG:-${COMMIT_SHA:0:7}}"
          [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::Etiqueta no válida: '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          OWNER_LC="$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")"

          # Los applicationId se buscan por nombre; así no hay que mantener otro secreto.
          PROJECTS="$(curl -fsS "$API/project.all" -H "x-api-key: $DOKPLOY_API_KEY")"
          app_field() { # <campo> <nombre de la aplicación>
            jq -er --arg p "$DOKPLOY_PROJECT" --arg e "$DOKPLOY_ENVIRONMENT" --arg n "$2" --arg f "$1" '
              [ .[] | select(.name == $p) | (.environments // [])[] | select(.name == $e)
                | (.applications // [])[] | select(.name == $n) | .[$f] ] | first' <<<"$PROJECTS"
          }
          app_id() { app_field applicationId "$1"; }

          deploy_app() {
            local app="$1" id image
            id="$(app_id "clasificador-$app")" || { echo "::error::No existe clasificador-$app en $DOKPLOY_PROJECT/$DOKPLOY_ENVIRONMENT"; exit 1; }
            image="$REGISTRY/$OWNER_LC/clasificador-$app:$TAG"
            echo "→ $app: $image"
            jq -nc --arg id "$id" --arg img "$image" --arg u "$PULL_USERNAME" --arg p "$PULL_TOKEN" --arg r "$REGISTRY" '
              {applicationId: $id, dockerImage: $img,
               username: (if $u == "" then null else $u end),
               password: (if $p == "" then null else $p end),
               registryUrl: (if $u == "" then null else $r end)}' \
              | curl -fsS -X POST "$API/application.saveDockerProvider" \
                  -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' --data @- >/dev/null
            jq -nc --arg id "$id" --arg t "Release $COMMIT_REF ($TAG)" --arg d "$app · imagen $image" \
              '{applicationId: $id, title: $t, description: $d}' \
              | curl -fsS -X POST "$API/application.deploy" \
                  -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' --data @- >/dev/null
          }

          # Instante (UTC) anterior al despliegue del worker, con un minuto de margen por el desfase
          # de reloj: el script de espera solo mira despliegues posteriores.
          SINCE="$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%S)"
          WORKER_ID="$(app_id clasificador-worker)"
          WORKER_NAME="$(app_field appName clasificador-worker)"
          echo "worker_id=$WORKER_ID" >> "$GITHUB_OUTPUT"
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"

          deploy_app worker
          echo "Esperando a que el worker termine de desplegar, migre y esté sano antes de desplegar la web..."
          bash infra/scripts/wait-dokploy-app.sh \
            --app-id "$WORKER_ID" --app-name "$WORKER_NAME" --tag "$TAG" --since "$SINCE" --timeout 600
          deploy_app web

      # Dokploy despliega de forma asíncrona y el contenedor viejo sigue respondiendo mientras tanto:
      # por eso la condición de salida es la versión (la etiqueta), no solo `status: ok`.
      - name: Esperar a que la web sirva la versión desplegada y comprobar de nuevo el worker
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ steps.deploy.outputs.tag }}
          WORKER_ID: ${{ steps.deploy.outputs.worker_id }}
          WORKER_NAME: ${{ steps.deploy.outputs.worker_name }}
        run: |
          echo "Esperando a que $WEB_URL/api/health devuelva la versión '$EXPECTED' (hasta 5 min)..."
          GOT=''
          for i in $(seq 1 60); do
            BODY="$(curl -fsS --max-time 10 "$WEB_URL/api/health" 2>/dev/null || echo '')"
            STATUS="$(jq -r '.status // empty' <<<"$BODY" 2>/dev/null || echo '')"
            GOT="$(jq -r '.version // empty' <<<"$BODY" 2>/dev/null || echo '')"
            echo "Intento $i: status='${STATUS:-sin-respuesta}' version='${GOT:-?}'"
            if [ "$STATUS" = "ok" ] && [ "$GOT" = "$EXPECTED" ]; then
              echo "$BODY" | jq .
              # El worker debe seguir sano con la versión esperada (si cae tras el despliegue, falla aquí).
              bash infra/scripts/wait-dokploy-app.sh \
                --app-id "$WORKER_ID" --app-name "$WORKER_NAME" --tag "$EXPECTED" --timeout 120
              exit 0
            fi
            sleep 5
          done
          echo "::error::La web no sirve la versión '$EXPECTED' tras 5 min (última: '${GOT:-sin-respuesta}'). Para volver atrás, lanza este workflow a mano con la etiqueta anterior."
          exit 1
