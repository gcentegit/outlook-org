name: Publicación — imágenes, versión y despliegue

# Qué hace en cada push a main (todo en una misma ejecución, para que los jobs que dependen de
# «se ha creado una Release» lean los outputs de release-please y no esperen un evento de etiqueta,
# que GITHUB_TOKEN no dispara):
#
#   build           construye las imágenes arm64 UNA sola vez por commit (etiqueta = sha corto) con la
#                   versión del package.json raíz horneada. No despliega nada.
#   release-please  mantiene el PR de versión (CHANGELOG.md y package.json) y lanza la CI sobre su
#                   rama. Al fusionarse ese PR crea la etiqueta vX.Y.Z y la Release de GitHub.
#   promote         si se ha creado una Release, añade la etiqueta X.Y.Z a la imagen ya construida de
#                   ese commit (`docker buildx imagetools create`, sin reconstruir).
#   deploy          despliega esa versión en Dokploy (deploy.yml).
#
# Volver atrás: lanzar «Desplegar en Dokploy» (deploy.yml) a mano con la versión X.Y.Z.
# Detalle del proceso: docs/operacion/versiones-y-releases.md.
#
# Ajuste necesario del repositorio: Settings > Actions > General > Workflow permissions >
# «Allow GitHub Actions to create and approve pull requests» (release-please abre el PR de versión
# con GITHUB_TOKEN).
# Secretos y variables del despliegue: ver deploy.yml.

on:
  push:
    branches: [main]

permissions: {}

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build & Push — ${{ matrix.app }}
    # Runner arm64 nativo: el servidor de Dokploy es arm64 (Oracle Ampere); sin QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La versión del producto es la del package.json raíz; solo cambia en el commit del PR de versión.
      # La etiqueta corta es la misma (7 caracteres) que genera docker/metadata-action.
      - name: Resolve version and short SHA
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(jq -er .version package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión no válida en package.json: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/clasificador-${{ matrix.app }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché vive en el propio registro. Exportarla es lo caro: solo bajo demanda
          # (variable del repositorio EXPORT_BUILD_CACHE=true); leerla es gratis.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/clasificador-${{ matrix.app }}:buildcache
          cache-to: ${{ vars.EXPORT_BUILD_CACHE == 'true' && format('type=registry,ref={0}/{1}/clasificador-{2}:buildcache,mode=max', env.REGISTRY, env.OWNER, matrix.app) || '' }}
          # /health y /api/health devuelven la versión (X.Y.Z) y el commit; el panel los muestra en el pie.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ steps.ver.outputs.short }}

  release-please:
    name: Versión y Release (release-please)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # etiqueta, Release y rama del PR de versión
      pull-requests: write
      actions: write # lanzar la CI sobre la rama del PR de versión
    # Dos ejecuciones a la vez podrían crear dos PR de versión o dos Releases.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - name: release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub crea las ejecuciones `pull_request` de un PR abierto por Actions, pero las deja en
      # espera de aprobación (`action_required`), y sin ellas el PR de versión no se puede fusionar.
      # Aquí se aprueban. Si GitHub no lo permite con este token, queda un aviso: se aprueban a mano
      # con el botón «Approve workflows to run» del propio PR.
      - name: Aprobar la CI en espera del PR de versión
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            ids=''
            for _ in $(seq 1 12); do
              ids="$(gh run list --branch "$branch" --status action_required --json databaseId --jq '.[].databaseId')"
              [ -n "$ids" ] && break
              sleep 5
            done
            if [ -z "$ids" ]; then
              echo "::notice::No hay ejecuciones en espera en $branch."
              continue
            fi
            for id in $ids; do
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
                echo "Aprobada la ejecución $id de $branch"
              else
                echo "::warning::No se pudo aprobar la ejecución $id: apruébala en el PR de versión («Approve workflows to run»)."
              fi
            done
          done < <(jq -r '.[].headBranchName' <<<"$PRS")

  promote:
    name: Promover la imagen a la versión
    needs: [build, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    # Runner arm64: `imagetools inspect --format` resuelve la imagen de la plataforma del runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      # Commit etiquetado por la Release: normalmente es este mismo, pero si hubo otra fusión
      # justo detrás, release-please puede crear la Release de un commit anterior.
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se añade la etiqueta X.Y.Z al mismo manifiesto (mismo digest): no se reconstruye nada.
      - name: Tag the already built images with the version
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión no válida: '$VERSION'"; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit no válido: '$RELEASE_SHA'"; exit 1; }
          SHORT="${RELEASE_SHA:0:7}"
          OWNER_LC="$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")"

          for app in web worker; do
            REPO="$REGISTRY/$OWNER_LC/clasificador-$app"
            SRC="$REPO:$SHORT"

            # La imagen del commit la construye su propia ejecución: si es otra, puede estar aún en curso.
            for i in $(seq 1 60); do
              docker buildx imagetools inspect "$SRC" >/dev/null 2>&1 && break
              [ "$i" -lt 60 ] || { echo "::error::No existe la imagen $SRC (¿falló su construcción?). Relanza la construcción del commit $SHORT y vuelve a ejecutar los jobs fallidos."; exit 1; }
              echo "Esperando a la imagen $SRC ($i/60)..."
              sleep 30
            done

            # La versión horneada debe ser la de la Release: no se promociona otra cosa.
            BAKED="$(docker buildx imagetools inspect "$SRC" --format '{{ json .Image }}' \
              | jq -r '.config.Env[]? | select(startswith("APP_VERSION=")) | sub("^APP_VERSION="; "")')"
            [ "$BAKED" = "$VERSION" ] || { echo "::error::$SRC lleva la versión '$BAKED' y la Release es '$VERSION'."; exit 1; }

            echo "→ $SRC  =>  $REPO:$VERSION"
            docker buildx imagetools create --tag "$REPO:$VERSION" "$SRC"
            docker buildx imagetools inspect "$REPO:$VERSION" >/dev/null
          done

  deploy:
    name: Deploy to Dokploy
    needs: [release-please, promote]
    if: needs.promote.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
