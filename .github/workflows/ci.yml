name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  # El PR de versión lo crea release-please con GITHUB_TOKEN y GitHub no lanza la CI en esos PR;
  # release.yml la lanza a mano sobre su rama para que los checks obligatorios queden en verde.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La versión de pnpm sale de `packageManager` en el package.json raíz.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `typecheck`, `test` y `build` generan antes el cliente de Prisma (no necesita base de datos).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Pruebas de integración que solo necesitan PostgreSQL (las que además necesitan docling, cuya
  # imagen pesa 7 GB, se saltan: ver RUN_DOCLING_INTEGRATION en la prueba).
  integration:
    name: Integración · PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clasificador
          POSTGRES_PASSWORD: ci-clasificador
          POSTGRES_DB: clasificador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clasificador -d clasificador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_INTEGRATION: '1'
      DATABASE_URL: postgresql://clasificador:ci-clasificador@127.0.0.1:5432/clasificador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # El worker aplica las migraciones al arrancar, así que la base vacía basta.
      - name: Integration tests
        run: pnpm --filter @clasificador/worker exec vitest run src/shadow-service.integration.test.ts
