name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  # El PR de versión lo crea release-please con GITHUB_TOKEN y GitHub no lanza la CI en esos PR;
  # release.yml la lanza a mano sobre su rama para que los checks obligatorios queden en verde.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La versión de pnpm sale de `packageManager` en el package.json raíz.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `typecheck`, `test` y `build` generan antes el cliente de Prisma (no necesita base de datos).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Pruebas de integración con PostgreSQL. La de adjuntos usa PDF con capa de texto, que lee pdf.js:
  # no llama a docling, así que el servicio (imagen de 7 GB) no hace falta. `DOCLING_URL` apunta a un
  # puerto cerrado para que una llamada accidental a docling falle y la prueba lo detecte.
  integration:
    name: Integración · PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clasificador
          POSTGRES_PASSWORD: ci-clasificador
          POSTGRES_DB: clasificador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clasificador -d clasificador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_INTEGRATION: '1'
      RUN_ATTACHMENT_INTEGRATION: '1'
      DOCLING_URL: http://127.0.0.1:9
      DATABASE_URL: postgresql://clasificador:ci-clasificador@127.0.0.1:5432/clasificador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # El worker aplica las migraciones al arrancar, así que la base vacía basta.
      - name: Integration tests
        run: pnpm --filter @clasificador/worker exec vitest run src/shadow-service.integration.test.ts

  # Pruebas de navegador del panel (Playwright): `next dev` con AUTH_DEV_BYPASS contra una base
  # migrada y sembrada. Configuración en apps/web/playwright.config.ts.
  browser:
    name: Navegador · Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clasificador
          POSTGRES_PASSWORD: ci-clasificador
          POSTGRES_DB: clasificador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clasificador -d clasificador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://clasificador:ci-clasificador@127.0.0.1:5432/clasificador
      ADMIN_EMAIL: admin@ejemplo.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Migraciones y semilla: el panel necesita la base migrada y el administrador inicial, que
      # es el usuario con el que entra el bypass de desarrollo.
      - name: Migrate and seed
        run: pnpm db:migrate:deploy && pnpm db:seed

      - name: Install Chromium
        run: pnpm --filter @clasificador/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @clasificador/web test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Arranque de la imagen del worker tal como se publica: misma arquitectura que producción (arm64),
  # usuario `node` y migraciones contra una base vacía. Las pruebas de código no la ejecutan, así que
  # un fallo del Dockerfile (p. ej. un motor de Prisma que no se puede escribir) solo aparecería al
  # desplegar.
  worker-image:
    name: Imagen del worker · arranque
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clasificador
          POSTGRES_PASSWORD: ci-clasificador
          POSTGRES_DB: clasificador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clasificador -d clasificador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://clasificador:ci-clasificador@127.0.0.1:5432/clasificador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f apps/worker/Dockerfile -t clasificador-worker:ci .

      # Sin credenciales de Graph el worker arranca igual (no sincroniza): basta para probar
      # migraciones, semilla y colas. `/livez` solo responde bien cuando todo eso ha terminado.
      - name: Start and wait for /livez
        run: |
          docker run -d --name worker --network host -e DATABASE_URL \
            -e MODE=shadow -e MAILBOX=buzon@ejemplo.com clasificador-worker:ci
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' worker)" != true ]; then
              echo "::error::el worker se paró al arrancar"; docker logs --tail 100 worker; exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/livez; then echo; docker logs --tail 100 worker; exit 0; fi
            sleep 3
          done
          echo "::error::el worker no respondió en /livez en 3 minutos"
          docker logs --tail 100 worker
          exit 1

      - name: Migrations applied
        run: |
          expected=$(find packages/db/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          applied=$(docker run --rm --network host postgres:16-alpine psql -At "$DATABASE_URL" \
            -c 'SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')
          echo "migraciones: $applied aplicadas de $expected"
          [ "$applied" = "$expected" ]
