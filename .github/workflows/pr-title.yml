name: Título del PR

# Los PR se fusionan con «squash» y el TÍTULO pasa a ser el mensaje del commit en main, que es lo que
# lee release-please para calcular la versión y el CHANGELOG. Por eso se valida el título (no los
# commits de la rama, que se aplastan). Formato: `tipo(ámbito opcional): descripción`; un cambio
# incompatible lleva `!` tras el tipo (`feat!: ...`). Los tipos que salen en las notas de la release
# (feat, fix, perf, revert) llevan además un icono al principio de la descripción
# (`fix(web): 🔐 ...`) y la sección «Para las notas de la release» en la descripción del PR.
# Reglas: docs/operacion/versiones-y-releases.md.
#
# El PR de versión lo crea release-please con GITHUB_TOKEN y este workflow no se lanza en él (su título,
# `chore: release X.Y.Z`, ya es válido). Por eso este check no debe marcarse como obligatorio.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    name: Título del PR (Conventional Commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

      # Cada título es un punto de las notas de la Release y la sección «Para las notas de la release»
      # de la descripción es su detalle. Solo se exigen en los tipos que salen en el CHANGELOG.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/release-notes

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Icono en el título y notas de la release en la descripción
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node infra/release-notes/release-notes.ts check
