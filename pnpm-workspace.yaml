packages:
  - 'apps/*'
  - 'packages/*'
  - 'infra/dokploy'
  - 'infra/release-notes'

# pnpm 10+ no ejecuta scripts de instalación salvo los aprobados aquí.
# Prisma descarga su motor de migraciones (binario) en el postinstall.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true

# Versiones corregidas de dependencias indirectas con avisos de seguridad que sus paquetes padre aún
# no han subido. Se quitan cuando el padre las traiga por sí mismo.
overrides:
  postcss: ^8.5.30
  mysql2: ^3.24.6
  '@prisma/config>deepmerge-ts': ^8.0.2
